name: lunaris
# Conda environment for GPU/cluster use. Version bounds are kept in sync with
# pyproject.toml (the single source of truth): every package carries a lower and
# an upper bound so a solve cannot silently pull in an incompatible major release.
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - numpy>=1.24,<3
  - numba>=0.59,<0.65
  - scipy>=1.10,<2
  # Uncomment the pytorch-cuda version that matches your cluster's loaded CUDA module.
  # For example, if you load a module with CUDA 12.1, use pytorch-cuda=12.1.
  - pytorch>=2.0,<3
  - pytorch-cuda=12.1
  - h5py>=3.8,<4
  - matplotlib>=3.7,<4
  - pandas>=2.0,<3
  - tqdm>=4.64,<5
  - pip
  - pip:
      - spiceypy>=5.1,<8.1.1
      - pytest>=7.2,<10
