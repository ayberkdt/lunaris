name: tests

# CPU-only test workflow. It never downloads the large external scientific data
# (SPICE kernels, gravity/topography grids) and never requires a GPU: the marker
# filter below deselects `slow`, `requires_data`, and `requires_cuda` tests, and
# data-dependent tests skip themselves when their inputs are absent.
#
# Optional deps (PyTorch CPU build, h5py, PySide6) are installed because parts of
# the existing suite import them at module load. torch tests fall back to a clean
# skip via `pytest.importorskip` when torch is unavailable.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-core-smoke:
    # Reliable Windows support gate for the dependency-light engine/CLI surface.
    # This deliberately does not claim PySide6/OpenGL or CUDA validation.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel and smoke headless commands outside the checkout
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "lunaris-smoke-venv"
          $dataRoot = Join-Path $env:RUNNER_TEMP "lunaris external data"
          python -m venv $venv
          $python = Join-Path $venv "Scripts\python.exe"
          $lunaris = Join-Path $venv "Scripts\lunaris.exe"
          $lunarisData = Join-Path $venv "Scripts\lunaris-data.exe"
          $wheel = (Get-ChildItem -Path "dist\*.whl" | Select-Object -First 1).FullName
          & $python -m pip install --upgrade pip
          & $python -m pip install $wheel
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          Push-Location $env:RUNNER_TEMP
          try {
            & $python -c "import lunaris; print('lunaris', lunaris.__version__)"
            & $lunaris --help
            & $lunarisData --data-dir $dataRoot list
          } finally {
            Pop-Location
          }

      - name: Optional-dependency and Windows path boundary tests
        shell: pwsh
        run: |
          python -m pip install -e ".[dev]"
          pytest tests/test_optional_dependency_boundaries.py -q
          pytest tests/test_data_downloader.py -k "resolve_data_root" -q

  minimal-optional-boundaries:
    # The documented .[dev] path intentionally excludes ML/UI extras. Keep the
    # import-safe core and every console --help contract executable there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core + development tooling without optional ML/UI extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify optional-dependency boundaries on the minimal install
        run: pytest tests/test_optional_dependency_boundaries.py -q

      - name: Algorithm traceability audit (advisory)
        # Symbol-level coverage audit: lists algorithm-ish code not registered in
        # docs/algorithms/algorithm_registry.yaml. Advisory by design — it prints
        # hits but exits 0, so it never blocks a PR. Promote to a gate later by
        # adding --strict once the hit list is triaged to zero.
        run: python tools/algorithm_registry.py audit

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      # Headless Qt: the UI tests run against the offscreen platform plugin.
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install headless Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Torch import health check
        # A partial/namespace torch package imports "successfully" but lacks
        # core symbols, which turns every ML test into a confusing failure
        # instead of a clean skip. Fail fast here instead.
        run: python -c "import torch, torch.nn; print('torch', torch.__version__)"

      - name: Install Lunaris (CPU stack + dev/test deps)
        run: pip install -e ".[all]"

      - name: Run reproducible benchmark smoke tests
        run: pytest tests/test_benchmark_config.py tests/test_benchmark_provenance.py tests/test_benchmark_validation.py tests/test_benchmark_pipeline_smoke.py -q

      - name: Run CPU-only test suite (coverage + randomized order)
        # Soft coverage floor: --cov-fail-under guards against catastrophic
        # regressions while staying below the measured baseline so it does not
        # block routine PRs. Ratchet the floor up as coverage rises (the value is
        # documented in pyproject.toml [tool.coverage.report]). pytest-randomly
        # (installed via the dev extra) shuffles test order every run to surface
        # order-dependent state leakage like the earlier Qt-binding pollution.
        run: >-
          pytest tests/ -m "not slow and not requires_data and not requires_cuda" -q
          --cov=lunaris --cov-report=term-missing:skip-covered
          --cov-report=xml --cov-report=html

      - name: Upload coverage report (xml + html)
        # Per-PR / per-matrix artifact so the coverage trend is inspectable
        # without a third-party coverage service.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30

  guardrails:
    # Ruff baseline is clean and now gates the build. Import-linter reached zero
    # broken contracts in Phase 2 and also gates. Mypy (common+core+physics)
    # reached zero errors during the freeze cleanup and now gates as well.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install guardrail tooling
        # ruff is pinned to the same version as .pre-commit-config.yaml — an
        # unpinned latest-ruff here has broken the gate on new-rule releases
        # three times before. Torch (CPU wheel) is installed so mypy checks the
        # in-scope ML modules against real torch types instead of silently
        # passing on ignore_missing_imports (environment-sensitive gate).
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.12.0" import-linter mypy
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: ruff (lint + import order) [gate]
        run: ruff check src tests

      - name: import-linter (architecture gate)
        # Static graph analysis; torch/Qt extras are not required.
        run: |
          pip install -e .
          lint-imports

      - name: mypy (type gate)
        # Scoped to the typed layers declared in pyproject [tool.mypy] files
        # (common + core + physics + typed ST-LRPS layers); baseline is zero so
        # this gates the build. Runs WITH torch installed so Tensor-typed code
        # is actually checked; Qt/spice extras remain out of scope via
        # ignore_missing_imports.
        run: mypy

  critical-core-runtime-coverage:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install headless Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU stack
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[all]"

      - name: Torch import health check
        run: python -c "import torch, torch.nn; print('torch', torch.__version__)"

      - name: Critical contract/runtime coverage gate
        run: >-
          pytest
          tests/test_core_regressions.py
          tests/test_core_cleanup.py
          tests/test_propagator_physics.py
          tests/test_propagator_accuracy_tuning.py
          tests/test_propagation_plans.py
          tests/test_accepted_state_telemetry.py
          tests/test_monitor_contract.py
          tests/test_monitor_emitter.py
          tests/test_monitor_replay.py
          tests/test_monitor_store.py
          tests/test_frame_policy.py
          tests/test_main_ephemeris_policy.py
          tests/test_gravity_provider_fallback_policy.py
          tests/test_cli_run_helpers.py
          tests/test_surrogate_runtime_contract_helpers.py
          tests/test_surrogate_runtime_import_compat.py
          tests/test_time_grid_contract.py
          tests/test_state_vector_contract.py
          tests/test_batch_backend_dispatch.py
          tests/test_batch_gpu_policy.py
          tests/test_batch_result_validity.py
          -m "not slow and not requires_data and not requires_cuda" -q --assert=plain
          --cov=lunaris
          --cov-report=term-missing:skip-covered
          --cov-fail-under=0
        
      - name: Enforce 80% coverage floor on critical contracts
        run: >-
          coverage report
          --include="src/lunaris/batch/backend_policy.py,src/lunaris/common/state_vector.py,src/lunaris/common/telemetry_contract.py,src/lunaris/common/time_grid_contract.py,src/lunaris/core/dynamics/contracts.py,src/lunaris/core/propagation/diagnostics.py,src/lunaris/core/propagation/fixed_step_runner.py,src/lunaris/core/propagation/telemetry_emitter.py,src/lunaris/core/propagation/time_grid.py,src/lunaris/ui/monitor/replay.py,src/lunaris/ui/monitor/store.py,src/lunaris/surrogate/runtime/artifact.py,src/lunaris/surrogate/runtime/device.py,src/lunaris/surrogate/runtime/metadata.py,src/lunaris/surrogate/runtime/scalers.py"
          --fail-under=80

  wheel-install-smoke:
    # Clean-machine contract: the built wheel must install into a bare venv and
    # the headless entry points must work OUTSIDE the repository checkout
    # (exercises the packaged data_sources.json fallback and the asset-free
    # config bootstrap — the class of bug that once crashed `lunaris` on a
    # machine without the repo's data/ folder).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install the wheel into a bare venv and smoke the CLIs from /tmp
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --upgrade pip
          /tmp/smoke-venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke-venv/bin/lunaris --help > /dev/null
          /tmp/smoke-venv/bin/lunaris-data list
          /tmp/smoke-venv/bin/lunaris-data download --all --dry-run
          /tmp/smoke-venv/bin/python -c "import lunaris; print('lunaris', lunaris.__version__)"

      - name: Assert no third-party node_modules files leaked into the wheel
        run: |
          python - <<'EOF'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          bad = [n for n in zipfile.ZipFile(wheel).namelist() if "node_modules" in n]
          if bad:
              print("::error::node_modules files leaked into the wheel:", bad)
              sys.exit(1)
          print("wheel content clean:", wheel)
          EOF

  locks:
    # Dependency-lock freshness gate. The committed locks/ files are hash-pinned
    # resolutions of pyproject.toml for Linux + CPython 3.11 (paper-evidence / HPC
    # reproducibility). Regenerate them here and fail if they drift from
    # pyproject.toml so "changed a dependency range but forgot to refresh the
    # locks" is caught before it breaks a reproducible install. Only the pinned
    # requirements + hashes are compared (comment headers are stripped, so a uv
    # version bump alone does not fail the gate).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Verify lock freshness (linux + py3.11)
        run: |
          set -euo pipefail
          cp locks/requirements-hpc-linux-py311.lock.txt /tmp/hpc.lock.txt
          uv pip compile pyproject.toml --extra hpc \
            --python-version 3.11 --python-platform linux --generate-hashes \
            -o /tmp/hpc.lock.txt
          cp locks/requirements-all-linux-py311.lock.txt /tmp/all.lock.txt
          uv pip compile pyproject.toml --extra all \
            --python-version 3.11 --python-platform linux --generate-hashes \
            -o /tmp/all.lock.txt
          diff <(grep -v '^#' locks/requirements-hpc-linux-py311.lock.txt) <(grep -v '^#' /tmp/hpc.lock.txt) \
            || { echo "::error::locks/requirements-hpc-linux-py311.lock.txt is stale; regenerate per locks/README.md"; exit 1; }
          diff <(grep -v '^#' locks/requirements-all-linux-py311.lock.txt) <(grep -v '^#' /tmp/all.lock.txt) \
            || { echo "::error::locks/requirements-all-linux-py311.lock.txt is stale; regenerate per locks/README.md"; exit 1; }
