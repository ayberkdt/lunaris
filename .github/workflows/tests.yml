name: tests

# CPU-only test workflow. It never downloads the large external scientific data
# (SPICE kernels, gravity/topography grids) and never requires a GPU: the marker
# filter below deselects `slow`, `requires_data`, and `requires_cuda` tests, and
# data-dependent tests skip themselves when their inputs are absent.
#
# Optional deps (PyTorch CPU build, h5py, PySide6) are installed because parts of
# the existing suite import them at module load. torch tests fall back to a clean
# skip via `pytest.importorskip` when torch is unavailable.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      # Headless Qt: the UI tests run against the offscreen platform plugin.
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install headless Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Lunaris (CPU stack + dev/test deps)
        run: pip install -e ".[all]"

      - name: Run reproducible benchmark smoke tests
        run: pytest tests/test_benchmark_config.py tests/test_benchmark_provenance.py tests/test_benchmark_validation.py tests/test_benchmark_pipeline_smoke.py -q

      - name: Run CPU-only test suite (coverage + randomized order)
        # Soft coverage floor: --cov-fail-under guards against catastrophic
        # regressions while staying below the measured baseline so it does not
        # block routine PRs. Ratchet the floor up as coverage rises (the value is
        # documented in pyproject.toml [tool.coverage.report]). pytest-randomly
        # (installed via the dev extra) shuffles test order every run to surface
        # order-dependent state leakage like the earlier Qt-binding pollution.
        run: >-
          pytest tests/ -m "not slow and not requires_data and not requires_cuda" -q
          --cov=lunaris --cov-report=term-missing:skip-covered
          --cov-report=xml --cov-report=html

      - name: Upload coverage report (xml + html)
        # Per-PR / per-matrix artifact so the coverage trend is inspectable
        # without a third-party coverage service.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30

  guardrails:
    # Ruff baseline is clean and now gates the build. Import-linter reached zero
    # broken contracts in Phase 2 and also gates. Mypy (common+core+physics)
    # reached zero errors during the freeze cleanup and now gates as well.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install guardrail tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff import-linter mypy

      - name: ruff (lint + import order) [gate]
        run: ruff check src tests

      - name: import-linter (architecture gate)
        # Static graph analysis; torch/Qt extras are not required.
        run: |
          pip install -e .
          lint-imports

      - name: mypy (type gate)
        # Scoped to the typed layers declared in pyproject [tool.mypy] files
        # (common + core + physics); baseline is zero so this gates the build.
        # ignore_missing_imports keeps torch/Qt/spice extras out of scope.
        run: mypy

  locks:
    # Dependency-lock freshness gate. The committed locks/ files are hash-pinned
    # resolutions of pyproject.toml for Linux + CPython 3.11 (paper-evidence / HPC
    # reproducibility). Regenerate them here and fail if they drift from
    # pyproject.toml so "changed a dependency range but forgot to refresh the
    # locks" is caught before it breaks a reproducible install. Only the pinned
    # requirements + hashes are compared (comment headers are stripped, so a uv
    # version bump alone does not fail the gate).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Verify lock freshness (linux + py3.11)
        run: |
          set -euo pipefail
          uv pip compile pyproject.toml --extra hpc \
            --python-version 3.11 --python-platform linux --generate-hashes \
            -o /tmp/hpc.lock.txt
          uv pip compile pyproject.toml --extra all \
            --python-version 3.11 --python-platform linux --generate-hashes \
            -o /tmp/all.lock.txt
          diff <(grep -v '^#' locks/requirements-hpc-linux-py311.lock.txt) <(grep -v '^#' /tmp/hpc.lock.txt) \
            || { echo "::error::locks/requirements-hpc-linux-py311.lock.txt is stale; regenerate per locks/README.md"; exit 1; }
          diff <(grep -v '^#' locks/requirements-all-linux-py311.lock.txt) <(grep -v '^#' /tmp/all.lock.txt) \
            || { echo "::error::locks/requirements-all-linux-py311.lock.txt is stale; regenerate per locks/README.md"; exit 1; }
