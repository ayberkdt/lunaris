[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunaris"
version = "0.1.0"
description = "Lunar orbit propagation and ST-LRPS surrogate gravity modeling tools"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Lunaris contributors" }
]
keywords = [
  "lunar",
  "astrodynamics",
  "orbit-propagation",
  "gravity-modeling",
  "lunar-gravity",
  "spherical-harmonics",
  "surrogate-modeling",
  "scientific-machine-learning",
  "physics-informed-machine-learning",
  "sobolev-training",
  "monte-carlo",
  "gpu-computing",
  "hpc",
  "st-lrps",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]
# Version policy: every dependency carries a lower bound (a realistic, tested
# floor for the supported Python range) AND an upper bound that caps the next
# major release. The upper caps guard installs and CI against breaking releases
# (e.g. numpy 3, torch 3, PySide6 7) landing silently. numba additionally pins
# numpy itself; we keep numpy < 3 so numba's own constraint resolves cleanly.
dependencies = [
  "numpy>=1.24,<3",
  "numba>=0.59,<0.65",
  "scipy>=1.10,<2",
  "pandas>=2.0,<3",
  "matplotlib>=3.7,<4",
  "spiceypy>=5.1,<9",
  "tqdm>=4.64,<5",
]

[project.optional-dependencies]
# Optional GPU / ML stack. ``hpc`` is kept as an explicit alias of ``ml`` so the
# documented ``pip install lunaris[hpc]`` workflow keeps working.
ml = [
  "torch>=2.0,<3",
  "h5py>=3.8,<4",
]
hpc = [
  "torch>=2.0,<3",
  "h5py>=3.8,<4",
]
# Both Qt bindings are required: the main UI uses PySide6, the ST-LRPS studio
# imports PyQt6. Do not drop either.
ui = [
  "PySide6>=6.5,<7",
  "PyQt6>=6.5,<7",
  "pyqtgraph>=0.13,<0.16",
]
reports = [
  "reportlab>=4.0,<5",
]
dev = [
  "pytest>=7.2,<10",
  "pytest-cov>=4.1,<7",
  "pytest-randomly>=3.12,<4",
  "ruff>=0.6,<0.13",
  "mypy>=1.8,<2",
  "import-linter>=2.0,<3",
  "pre-commit>=3.5,<5",
]
all = [
  "torch>=2.0,<3",
  "h5py>=3.8,<4",
  "PySide6>=6.5,<7",
  "PyQt6>=6.5,<7",
  "pyqtgraph>=0.13,<0.16",
  "reportlab>=4.0,<5",
  "pytest>=7.2,<10",
  "pytest-cov>=4.1,<7",
  "pytest-randomly>=3.12,<4",
  "ruff>=0.6,<0.13",
  "mypy>=1.8,<2",
  "import-linter>=2.0,<3",
  "pre-commit>=3.5,<5",
]

[project.scripts]
lunaris = "lunaris.cli.main:main_entry"
lunaris-ui = "lunaris.ui.app:main"
lunaris-launcher = "lunaris.ui.launcher:main"
lunaris-studio = "lunaris.surrogate.st_lrps.ui.studio:main"
lunaris-mc = "lunaris.core.monte_carlo_engine:mc_entry"
lunaris-train = "lunaris.surrogate.st_lrps.training.cli:main"
lunaris-train-force-direct = "lunaris.surrogate.st_lrps.training.force_direct_cli:main"
lunaris-eval = "lunaris.surrogate.st_lrps.evaluation.cli:main"
lunaris-eval-force-direct = "lunaris.surrogate.st_lrps.evaluation.force_direct_eval:main"
lunaris-validate = "lunaris.surrogate.st_lrps.evaluation.validation_suite:main"
lunaris-ablation = "lunaris.surrogate.st_lrps.evaluation.ablation:main"
lunaris-st-lrps-paper-evidence = "lunaris.surrogate.st_lrps.paper_evidence.runner:main"
lunaris-benchmark = "lunaris.surrogate.st_lrps.evaluation.compare_gravity_models:main"
lunaris-data = "lunaris.cli.data:main"
lunaris-perturbation-budget = "lunaris.analysis.perturbation_budget.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lunaris*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running tests (deselect with -m 'not slow')",
  "integration: end-to-end tests that exercise multiple layers together",
  "requires_data: needs large external data (SPICE kernels, gravity/topography files)",
  "requires_cuda: needs an NVIDIA CUDA device",
  "requires_torch: needs PyTorch installed (skipped cleanly otherwise)",
]
# pytest-randomly shuffles test order every run. This catches order-dependent
# state leakage (e.g. the Qt-binding pollution that produced setFont/setIcon
# failures). Pin a default seed locally if a shuffle exposes a real ordering bug
# you need to reproduce: `pytest -p randomly --randomly-seed=<n>`.

# ---------------------------------------------------------------------------
# Phase-1 hardening guardrails. All start in "report" mode (run in CI, not yet
# gating) so the freeze cleanup can drive each baseline to zero before the CI
# step is flipped to fail-on-error.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Conservative starter set: pyflakes (F), import sort (I), pycodestyle (E/W),
# pyupgrade (UP), bugbear (B). Expand once the baseline is clean.
select = ["E", "F", "W", "I", "UP", "B"]
# E501 (line length) is intentionally not enforced during the freeze to avoid
# mass reflow churn; revisit once the substantive lint baseline is clean.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
# Kademeli adoption: start with the dependency-light SSOT layers, then widen.
files = ["src/lunaris/common", "src/lunaris/core"]

[tool.coverage.run]
source = ["lunaris"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# Enforces the documented layering: a layer never imports from a layer above it.
# Encoded as forbidden contracts (precise and low-risk) rather than a full
# ``layers`` contract, which keeps the surrogate package out of scope for now.
[tool.importlinter]
root_package = "lunaris"

[[tool.importlinter.contracts]]
name = "common stays dependency-light (no upward imports)"
type = "forbidden"
source_modules = ["lunaris.common"]
forbidden_modules = [
  "lunaris.physics",
  "lunaris.core",
  "lunaris.analysis",
  "lunaris.visualization",
  "lunaris.ui",
  "lunaris.surrogate",
]

[[tool.importlinter.contracts]]
name = "physics never imports core/analysis/visualization/ui"
type = "forbidden"
source_modules = ["lunaris.physics"]
forbidden_modules = [
  "lunaris.core",
  "lunaris.analysis",
  "lunaris.visualization",
  "lunaris.ui",
]
