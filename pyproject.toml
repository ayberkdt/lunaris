[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunaris"
version = "0.1.0rc1"
description = "Lunar orbit propagation and ST-LRPS surrogate gravity modeling tools"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Ayberk Demirkanat", email = "ayberkdemirkanat@gmail.com" }
]
maintainers = [
  { name = "Ayberk Demirkanat", email = "ayberkdemirkanat@gmail.com" }
]
keywords = [
  "lunar",
  "astrodynamics",
  "orbit-propagation",
  "gravity-modeling",
  "lunar-gravity",
  "spherical-harmonics",
  "surrogate-modeling",
  "scientific-machine-learning",
  "physics-informed-machine-learning",
  "sobolev-training",
  "uncertainty-propagation",
  "gpu-computing",
  "hpc",
  "st-lrps",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]
# Version policy: every dependency carries a lower bound (a realistic, tested
# floor for the supported Python range) AND an upper bound that caps the next
# major release. The upper caps guard installs and CI against breaking releases
# (e.g. numpy 3, torch 3, PySide6 7) landing silently. numba additionally pins
# numpy itself; we keep numpy < 3 so numba's own constraint resolves cleanly.
dependencies = [
  "numpy>=1.24,<3",
  "numba>=0.59,<0.65",
  "scipy>=1.10,<2",
  "pandas>=2.0,<3",
  "matplotlib>=3.7,<4",
  "spiceypy>=5.1,<8.1.1",
  "tqdm>=4.64,<5",
]

[project.optional-dependencies]
# Optional GPU / ML stack. ``hpc`` is kept as an explicit alias of ``ml`` so the
# documented ``pip install lunaris[hpc]`` workflow keeps working.
ml = [
  "torch>=2.0,<3",
  "h5py>=3.8,<4",
  # RAM-preload safety veto: without psutil the trainer cannot see available
  # memory and silently skips the check (risky on cgroup-limited HPC nodes).
  "psutil>=5.9,<8",
]
hpc = [
  "torch>=2.0,<3",
  "h5py>=3.8,<4",
  "psutil>=5.9,<8",
]
# Single Qt binding: both the mission UI and the ST-LRPS studio use PySide6
# (Phase 3 consolidation; PyQt6 was dropped to remove the dual-binding bug class).
ui = [
  "PySide6>=6.5,<7",
  "pyqtgraph>=0.13,<0.16",
  "PyOpenGL>=3.1,<4",
  "qtawesome>=1.3,<2",
]
reports = [
  "reportlab>=4.0,<5",
]
dev = [
  "pytest>=7.2,<10",
  "pytest-cov>=4.1,<7",
  "pytest-randomly>=3.12,<4",
  "ruff>=0.6,<0.13",
  "mypy>=1.8,<2",
  "import-linter>=2.0,<3",
  "pre-commit>=3.5,<5",
  # Algorithm-traceability registry tooling (tools/algorithm_registry.py):
  # parse the YAML source of truth and validate it against the JSON Schema.
  # Dev-only; the runtime package never imports these.
  "pyyaml>=6,<7",
  "jsonschema>=4.18,<5",
]
all = [
  "torch>=2.0,<3",
  "h5py>=3.8,<4",
  "psutil>=5.9,<8",
  "PySide6>=6.5,<7",
  "pyqtgraph>=0.13,<0.16",
  "PyOpenGL>=3.1,<4",
  "qtawesome>=1.3,<2",
  "reportlab>=4.0,<5",
  "pytest>=7.2,<10",
  "pytest-cov>=4.1,<7",
  "pytest-randomly>=3.12,<4",
  "ruff>=0.6,<0.13",
  "mypy>=1.8,<2",
  "import-linter>=2.0,<3",
  "pre-commit>=3.5,<5",
  "pyyaml>=6,<7",
  "jsonschema>=4.18,<5",
]

[project.urls]
Homepage = "https://github.com/ayberkdt/lunaris"
Repository = "https://github.com/ayberkdt/lunaris"
Issues = "https://github.com/ayberkdt/lunaris/issues"
Changelog = "https://github.com/ayberkdt/lunaris/blob/main/CHANGELOG.md"

[project.scripts]
lunaris = "lunaris.cli.main:main_entry"
lunaris-ui = "lunaris.cli.entrypoints:ui_main"
lunaris-launcher = "lunaris.cli.entrypoints:launcher_main"
lunaris-studio = "lunaris.cli.entrypoints:studio_main"
lunaris-batch = "lunaris.cli.batch:batch_entry"
lunaris-train = "lunaris.cli.entrypoints:train_main"
lunaris-eval = "lunaris.cli.entrypoints:eval_main"
lunaris-validate = "lunaris.cli.entrypoints:validate_main"
lunaris-ablation = "lunaris.surrogate.st_lrps.evaluation.ablation:main"
lunaris-st-lrps-paper-evidence = "lunaris.surrogate.st_lrps.paper_evidence.runner:main"
lunaris-benchmark = "lunaris.cli.entrypoints:benchmark_main"
lunaris-data = "lunaris.cli.data:main"
lunaris-perturbation-budget = "lunaris.analysis.perturbation_budget.cli:main"
lunaris-frozen-search = "lunaris.cli.frozen_search:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lunaris*"]
# The optional Next.js web preview keeps its node_modules inside the source
# tree when built locally; without this exclude, stray third-party .py files
# from npm packages leak into the wheel (tests/test_repo_hygiene.py guards it).
exclude = ["lunaris.ui.web.node_modules*"]

[tool.setuptools.package-data]
# Wheel installs have no repository root: lunaris-data falls back to this
# packaged manifest copy (kept byte-identical to data/data_sources.json by a
# repo-hygiene test).
"lunaris.cli" = ["data_sources.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so the top-level `validation/` harness package is
# importable under a bare `pytest` invocation (CI uses `pytest tests/`, which —
# unlike `python -m pytest` — does not add the CWD). `validation/` is a dev/
# research package and is intentionally NOT installed (packages.find = lunaris*).
pythonpath = ["."]
markers = [
  "slow: long-running tests (deselect with -m 'not slow')",
  "integration: end-to-end tests that exercise multiple layers together",
  "requires_data: needs large external data (SPICE kernels, gravity/topography files)",
  "requires_cuda: needs an NVIDIA CUDA device",
  "requires_torch: needs PyTorch installed (skipped cleanly otherwise)",
  "requires_h5py: needs h5py installed (skipped cleanly otherwise)",
  "requires_pyshtools: needs the optional pyshtools library (skipped cleanly otherwise)",
  "requires_tudatpy: needs the optional tudatpy library (skipped cleanly otherwise)",
]
# pytest-randomly shuffles test order every run. This catches order-dependent
# state leakage (e.g. the Qt-binding pollution that produced setFont/setIcon
# failures). Pin a default seed locally if a shuffle exposes a real ordering bug
# you need to reproduce: `pytest -p randomly --randomly-seed=<n>`.

# ---------------------------------------------------------------------------
# Phase-1 hardening guardrails. All start in "report" mode (run in CI, not yet
# gating) so the freeze cleanup can drive each baseline to zero before the CI
# step is flipped to fail-on-error.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Conservative starter set: pyflakes (F), import sort (I), pycodestyle (E/W),
# pyupgrade (UP), bugbear (B). The baseline is now clean and gated in CI.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  # E501 (line length): not enforced to avoid mass reflow churn; revisit later.
  "E501",
  # E402 / E701 / E702 are NOT globally ignored. They are enforced everywhere
  # except the specific files listed under `per-file-ignores` below, where the
  # ignore is a deliberate, auditable exception (numba/CUDA compact kernels for
  # E701/E702; pre-import bootstraps and cycle-avoidance imports for E402). This
  # keeps new files from silently inheriting a blanket amnesty.
]

[tool.ruff.lint.per-file-ignores]
# --- E701/E702: compact one-liners in numba/CUDA kernels only ---
# These modules host the numerical hot-path kernels where component-wise vector
# assignments are written as intentional compact one-liners (e.g.
# `out[0]=0.0; out[1]=0.0; out[2]=0.0`). Everywhere else E701/E702 are enforced.
"src/lunaris/core/batch_propagator.py" = ["E702"]
"src/lunaris/common/math_utils.py" = ["E702"]

# --- E402: deliberate pre-import bootstraps / cycle-avoidance imports ---
# Each file below imports below the top of the module for a concrete reason that
# cannot be reordered away: matplotlib backend selection before `pyplot`, Qt
# platform/env setup before the Qt import, guarded optional torch/h5py imports
# behind availability flags, run-as-script `sys.path` fixes, sectioned UI entry
# modules, or imports placed after the helpers they would otherwise pull in at
# module-load time (cycle avoidance). Enumerated explicitly so the rest of the
# tree stays E402-clean.
"src/lunaris/analysis/reporting/manager.py" = ["E402"]
"src/lunaris/ui/app.py" = ["E402"]
"src/lunaris/ui/core/session_persistence.py" = ["E402"]
"src/lunaris/core/torch_sh_propagator.py" = ["E402"]
"src/lunaris/core/torch_batch_propagator.py" = ["E402"]
"src/lunaris/surrogate/st_lrps/evaluation/cli.py" = ["E402"]
"src/lunaris/surrogate/st_lrps/runtime/canonical_runtime.py" = ["E402"]

# The ST-LRPS Studio pages import their shared Qt/widget surface explicitly from
# the `qt_common` / `common_widgets` hubs (no `import *`), so star-import
# diagnostics no longer apply. They still import below module-level Qt/theme setup
# and sectioned constants (E402).
"src/lunaris/surrogate/st_lrps/ui/studio_parts/*.py" = ["E402"]
# studio.py is the Studio facade and training/cli.py the training entry point;
# both deliberately re-export tabs / CLI helpers / dataset utilities consumed by
# tests and external callers, so their re-export imports must not be pruned.
"src/lunaris/surrogate/st_lrps/ui/studio.py" = ["F401"]
"src/lunaris/surrogate/st_lrps/training/cli.py" = ["F401"]
# Tests legitimately import for importability assertions ("can this still be
# imported from its canonical path?"), fixture registration, and import-time
# side effects, so an unused-import there is signal, not noise. Enforcing F401
# in tests also tempts autofix into deleting those intentional imports.
# E402: tests frequently guard imports behind `pytest.importorskip(...)` or a
# feature-availability flag, which must run before the guarded import.
"tests/*" = ["F401", "E402"]
# Qt model/view overrides require the framework signature `def rowCount(self,
# parent=QModelIndex())`; the default-arg call is idiomatic and unavoidable.
"src/lunaris/surrogate/st_lrps/ui/dashboard_widgets.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
# Kademeli adoption: start with the dependency-light SSOT layers, then widen.
# common+core are clean; physics is now type-checked too (engine force models).
# The ST-LRPS surrogate is being adopted bottom-up: its foundational, dependency-
# light layers (capability/target/artifact contracts, isometric scaling, split
# policies, dataset contract, body constants) are type-checked here; the heavier
# training/evaluation/runtime/UI layers stay out of scope for now (see the
# per-module skip override below) and will be widened incrementally.
files = [
  "src/lunaris/common",
  "src/lunaris/core",
  "src/lunaris/physics",
  # --- Batch/CLI contracts and archive plumbing ---
  "src/lunaris/batch/backend_policy.py",
  "src/lunaris/batch/requirements.py",
  "src/lunaris/batch/storage.py",
  "src/lunaris/batch/provenance.py",
  "src/lunaris/cli/options.py",
  "src/lunaris/cli/common_args.py",
  "src/lunaris/cli/run.py",
  # --- ST-LRPS foundational SSOT layers (shared contracts, scaling, constants) ---
  "src/lunaris/surrogate/st_lrps/shared/capabilities.py",
  "src/lunaris/surrogate/st_lrps/shared/contracts.py",
  "src/lunaris/surrogate/st_lrps/shared/scaling.py",
  "src/lunaris/surrogate/st_lrps/data/dataset_parameters.py",
  "src/lunaris/surrogate/st_lrps/data/splits.py",
  "src/lunaris/surrogate/st_lrps/data/dataset_contract.py",
  "src/lunaris/surrogate/st_lrps/data/dataset_validation.py",
  "src/lunaris/surrogate/st_lrps/data/quality_report.py",
  "src/lunaris/surrogate/st_lrps/data/datasets.py",
  # --- ST-LRPS training support (config, loss, metrics, checkpointing, gates) ---
  "src/lunaris/surrogate/st_lrps/training/config.py",
  "src/lunaris/surrogate/st_lrps/training/config_summary.py",
  "src/lunaris/surrogate/st_lrps/training/losses.py",
  "src/lunaris/surrogate/st_lrps/training/metrics.py",
  "src/lunaris/surrogate/st_lrps/training/checkpoint_manager.py",
  "src/lunaris/surrogate/st_lrps/training/periodic_eval.py",
  "src/lunaris/surrogate/st_lrps/training/preflight.py",
  "src/lunaris/surrogate/st_lrps/training/compute_accounting.py",
  # --- ST-LRPS evaluation/runtime support ---
  "src/lunaris/surrogate/st_lrps/evaluation/progress.py",
  "src/lunaris/surrogate/st_lrps/evaluation/provenance.py",
  "src/lunaris/surrogate/st_lrps/evaluation/benchmark_config.py",
  "src/lunaris/surrogate/st_lrps/evaluation/error_decomposition.py",
  "src/lunaris/surrogate/runtime/artifact.py",
  "src/lunaris/surrogate/runtime/device.py",
  "src/lunaris/surrogate/runtime/force_runtime.py",
  "src/lunaris/surrogate/runtime/metadata.py",
  "src/lunaris/surrogate/runtime/scalers.py",
  "src/lunaris/surrogate/st_lrps/runtime/profiling.py",
]

# Still-untyped ST-LRPS code (and the rest of the surrogate package): skip
# following imports into it so the typed foundational modules above can be
# checked without dragging the heavy training/evaluation/runtime/UI code (and its
# torch/h5py/PySide6 surface) into scope, and so checked layers above (core,
# physics) keep treating surrogate imports as before. Modules listed explicitly
# in `files` are still checked despite this skip — the override only governs how
# *imported* modules are followed.
[[tool.mypy.overrides]]
module = [
  "lunaris.analysis.*",
  "lunaris.visualization.*",
]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "lunaris.surrogate.*"
follow_imports = "skip"

[tool.coverage.run]
source = ["lunaris"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Exclude code that is never part of the importable library under test, so the
# coverage number reflects real tested logic rather than script-only or
# type-checking-only lines. `exclude_also` ADDS to coverage's defaults (which
# already include `pragma: no cover`).
exclude_also = [
  "if __name__ == .__main__.:",       # module self-test blocks (run via `python mod.py`, never imported)
  "if TYPE_CHECKING:",                  # import-only type hints
  "raise NotImplementedError",          # abstract stubs
  "@(abc\\.)?abstractmethod",           # abstract methods
]
# Soft coverage floor (report-then-gate). Measured baseline of the CPU suite
# (`-m "not slow and not requires_data and not requires_cuda"`) was 58% on
# 2026-06-15 (1569 tests). The floor is held a few points below the baseline so
# it guards against catastrophic regressions without blocking routine PRs;
# ratchet it upward as coverage rises. Critical contract/runtime modules are
# separately gated at 80% in `.github/workflows/tests.yml`.
# pytest-cov honors this via fail_under.
fail_under = 55

# Enforces the documented layering: a layer never imports from a layer above it.
# Encoded as forbidden contracts (precise and low-risk) rather than a full
# ``layers`` contract, which keeps the surrogate package out of scope for now.
[tool.importlinter]
root_package = "lunaris"
# Architecture contracts constrain *runtime* coupling. Imports made only inside
# `if TYPE_CHECKING:` guards impose no runtime dependency, so they are excluded
# (e.g. shared.scaling references data.datasets.DatasetMeta purely for typing).
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "common stays dependency-light (no upward imports)"
type = "forbidden"
source_modules = ["lunaris.common"]
forbidden_modules = [
  "lunaris.physics",
  "lunaris.core",
  "lunaris.analysis",
  "lunaris.visualization",
  "lunaris.ui",
  "lunaris.surrogate",
]

[[tool.importlinter.contracts]]
name = "physics never imports core/analysis/visualization/ui"
type = "forbidden"
source_modules = ["lunaris.physics"]
forbidden_modules = [
  "lunaris.core",
  "lunaris.analysis",
  "lunaris.visualization",
  "lunaris.ui",
]

# ---------------------------------------------------------------------------
# Phase 2.1 — subsystem boundary contracts.
# The repo is a modular monolith: an engine core (common/physics/core), the
# ST-LRPS ML subsystem, the desktop UIs, analysis/validation, and cli/loaders.
# These contracts make the intended dependency direction enforceable instead of
# documented only in prose.
# ---------------------------------------------------------------------------

[[tool.importlinter.contracts]]
name = "core does not import the desktop UI or the ST-LRPS ML pipeline"
type = "forbidden"
source_modules = ["lunaris.core"]
forbidden_modules = [
  "lunaris.ui",
  "lunaris.surrogate.st_lrps.training",
  "lunaris.surrogate.st_lrps.evaluation",
  "lunaris.surrogate.st_lrps.ui",
  "lunaris.surrogate.st_lrps.data",
]

[[tool.importlinter.contracts]]
name = "ST-LRPS runtime (inference path) stays light"
type = "forbidden"
source_modules = ["lunaris.surrogate.st_lrps.runtime"]
forbidden_modules = [
  "lunaris.surrogate.st_lrps.training",
  "lunaris.surrogate.st_lrps.evaluation",
  "lunaris.surrogate.st_lrps.ui",
  "lunaris.surrogate.st_lrps.paper_evidence",
  "lunaris.ui",
]

# The production runtime facade (PUBLIC_API's sanctioned ST-LRPS import) must
# obey the same lightness rule as the internal st_lrps runtime: inference never
# drags in training/evaluation/UI code.
[[tool.importlinter.contracts]]
name = "production ST-LRPS runtime facade stays light"
type = "forbidden"
source_modules = ["lunaris.surrogate.runtime"]
forbidden_modules = [
  "lunaris.surrogate.st_lrps.training",
  "lunaris.surrogate.st_lrps.evaluation",
  "lunaris.surrogate.st_lrps.ui",
  "lunaris.surrogate.st_lrps.paper_evidence",
  "lunaris.ui",
]

# The engine core must not depend on the CLI wiring or the batch orchestration
# package.
[[tool.importlinter.contracts]]
name = "core does not import the CLI or batch orchestration layers"
type = "forbidden"
source_modules = ["lunaris.core"]
forbidden_modules = ["lunaris.cli", "lunaris.batch"]

[[tool.importlinter.contracts]]
name = "analysis and visualization do not import the desktop UI"
type = "forbidden"
source_modules = ["lunaris.analysis", "lunaris.visualization"]
forbidden_modules = ["lunaris.ui"]

[[tool.importlinter.contracts]]
name = "physics does not depend on the ST-LRPS subsystem"
type = "forbidden"
source_modules = ["lunaris.physics"]
forbidden_modules = ["lunaris.surrogate"]

[[tool.importlinter.contracts]]
name = "ST-LRPS studio does not import mission-UI internals"
type = "forbidden"
source_modules = ["lunaris.surrogate.st_lrps.ui"]
forbidden_modules = ["lunaris.ui"]

[[tool.importlinter.contracts]]
name = "UI foundation stays independent of both desktop applications"
type = "forbidden"
source_modules = ["lunaris.ui_foundation"]
forbidden_modules = ["lunaris.ui", "lunaris.surrogate.st_lrps.ui"]
