    mathematical_contract:
      inputs: position, two evaluation degrees, and a blend altitude band
      outputs: >-
        acceleration that transitions C1-continuously between a low and a high
        evaluation degree across the band
      exact_or_approximate: continuous_policy_blend
      preserved_properties:
        - C1 continuity of the blended acceleration across the altitude band
    lunaris_modifications:
