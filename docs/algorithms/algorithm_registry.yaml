  - id: LUNARIS-HEUR-EVT-001
    slug: in_step_event_root_localization
    canonical_name: >-
      In-step event-time localization by bisection with a false-position final
      correction
    category: heuristic
    domain: EVT
    status: active
    added: "2026-07-14"
    implementation_class: heuristic
    verification_status: unverifiable
    scientific_status: implemented_and_tested
    citation_keys: []
    primary_reference: null
    symbols:
      - path: src/lunaris/core/propagation/events.py
        symbol: _refine_event_time_bisect
        role: cpu_implementation
      - path: src/lunaris/core/propagation/events.py
        symbol: _event_crossed
        role: cpu_implementation
    mathematical_contract:
      inputs: >-
        a single fixed-step interval with a sign change in the event function g,
        plus a sub-step re-integrator
      outputs: refined event time and state inside the interval
      exact_or_approximate: bracketed_root_localization
      preserved_properties:
        - keeps the bracket around the sign change
        - does not perturb the main integrator's state advancement
    lunaris_modifications:
      - >-
        Sub-steps are re-integrated from the interval start so symplectic
        stepping is unchanged; only the reported event time/state is refined.
      - fail-closed on non-finite bracket or callback values
    assumptions:
      - exactly one sign change of g within the interval
    limitations:
      - >-
        Policy, not a library root-finder: the underlying method is standard
        bisection with a false-position (regula-falsi) final linear-in-g
        correction; the in-step re-integration wrapper is Lunaris-specific.
    validation:
      - tests/test_events.py
      - tests/test_event_outcome_contract.py
    see_also: []
    notes: >-
      Terminal-event outcome selection follows SciPy solve_ivp parity semantics
      (earliest terminal crossing). The root find itself is elementary bisection
      + false position, hence no external primary source is claimed.

