  - id: LUNARIS-ALG-SUM-001
    slug: kahan_compensated_summation
    canonical_name: Kahan compensated summation
    category: numerical_algorithm
    domain: SUM
    status: active
    added: "2026-07-14"
    implementation_class: exact
    verification_status: verified_primary_source
    scientific_status: implemented_and_tested
    citation_keys:
      - Kahan1965ReducingErrors
    primary_reference:
      type: article
      citation_key: Kahan1965ReducingErrors
      identifier_kind: doi
      doi: 10.1145/363707.363723
      isbn: null
      report_number: null
      standard_number: null
      official_url: https://dl.acm.org/doi/10.1145/363707.363723
      edition: null
      chapter: null
      section: null
      equations: []
      pages: "40"
      verification_notes: >-
        W. Kahan, "Pracniques: Further Remarks on Reducing Truncation Errors",
        Communications of the ACM 8(1):40, January 1965. DOI 10.1145/363707.363723
        verified via the ACM Digital Library and Wikidata; the compensated-sum
        recurrence (running sum, carried error term, corrected addend) matches
        the one-page original exactly.
    symbols:
      - path: src/lunaris/physics/spherical_harmonics.py
        symbol: _kahan_sum_step
        role: numba_implementation
    mathematical_contract:
      inputs: running sum, carried compensation term, next addend
      outputs: updated running sum and updated compensation term
      exact_or_approximate: exact_error_free_transformation
      preserved_properties:
        - recovers low-order bits lost to rounding during accumulation
        - reduces summation error growth from O(n*eps) toward O(eps)
    lunaris_modifications:
      - >-
        Applied per-step inside the high-degree spherical-harmonic acceleration
        accumulation; the algorithm itself is unchanged.
    assumptions:
      - IEEE-754 round-to-nearest float64 arithmetic
      - compiler/JIT does not re-associate the compensation subtraction
    limitations:
      - does not help when individual addends are themselves inaccurate
      - guards against cancellation across many terms, not within one term
    validation:
      - tests/test_spherical_harmonics.py
      - tests/test_independent_sh_validation.py
    see_also:
      - LUNARIS-ALG-SH-002
    notes: >-
      Numba does not reorder these floating-point operations, so the
      compensation term survives compilation; this is why the recurrence is kept
      as an explicit four-line helper rather than a bare Python sum.

