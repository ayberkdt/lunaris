  - id: LUNARIS-ALG-SH-001
    slug: fully_normalized_alf_forward_column_recursion
    canonical_name: >-
      Standard forward-column recursion of fully-normalized associated Legendre
      functions
    category: numerical_algorithm
    domain: SH
    status: active
    added: "2026-07-14"
    implementation_class: exact
    verification_status: verified_primary_source
    scientific_status: implemented_and_tested
    citation_keys:
      - HolmesFeatherstone2002Legendre
    primary_reference:
      type: article
      citation_key: HolmesFeatherstone2002Legendre
      identifier_kind: doi
      doi: 10.1007/s00190-002-0216-2
      isbn: null
      report_number: null
      standard_number: null
      official_url: null
      edition: null
      chapter: null
      section: Standard forward-column recursion of normalised ALFs
      equations: []
      pages: "279-299"
      verification_notes: >-
        S. A. Holmes and W. E. Featherstone, "A unified approach to the Clenshaw
        summation and the recursive computation of very high degree and order
        normalised associated Legendre functions", Journal of Geodesy 76(5):
        279-299, 2002. DOI 10.1007/s00190-002-0216-2 verified via Springer. The
        implemented diagonal seed sqrt((2n+1)/2n), sub-diagonal sqrt(2n+1) and
        vertical coefficients A[n,m]=sqrt((2n-1)(2n+1)/((n-m)(n+m))),
        B[n,m]=sqrt((2n+1)(n-m-1)(n+m-1)/((2n-3)(n+m)(n-m))) are exactly the
        standard forward-column recursion presented in this paper (also Colombo
        1981).
    symbols:
      - path: src/lunaris/physics/spherical_harmonics.py
        symbol: build_legendre_coeffs
        role: reference_implementation
      - path: src/lunaris/physics/spherical_harmonics.py
        symbol: _compute_legendre_polynomials_inplace
        role: numba_implementation
      - path: src/lunaris/physics/spherical_harmonics.py
        symbol: _apply_legendre_normalization
        role: numba_implementation
    mathematical_contract:
      inputs: maximum degree, sin/cos of geocentric latitude
      outputs: >-
        fully-normalized associated Legendre functions P_nm and their latitude
        derivatives dP_nm/dphi
      exact_or_approximate: exact_recurrence
      preserved_properties:
        - 4-pi (geodesy) full normalization
        - numerical stability to very high degree/order
    lunaris_modifications:
      - >-
        Geodesy convention: no Condon-Shortley phase, real-harmonic sqrt(2)
        scaling for m>0 (matches GRAIL/EGM/GRACE/ICGEM coefficient definitions).
      - pole-safe per-order truncation via the stable-m limit (see LUNARIS-HEUR-SH-001)
    assumptions:
      - IEEE-754 float64 arithmetic
      - coefficients supplied in the same normalization convention
    limitations:
      - Condon-Shortley phase must be excluded by the coefficient provider
      - >-
        Reliable in IEEE-754 float64 only to degree ~1900 (Holmes &
        Featherstone 2002): above that, the sectoral seed cos(phi)^m can
        underflow before the recursion re-enters the oscillatory region
        (n >= m / cos(phi)), silently zeroing physically recovering columns;
        the Holmes-Featherstone global 1e-280 scaling would then be required.
        At the GRAIL maximum N=1800 the measured margin between the underflow
        cut and the oscillatory boundary is >= ~50 orders at every latitude
        (worst near cos(phi) ~ 0.4), verified against pyshtools at N=1800
        (2026-07-14).
    validation:
      - tests/test_spherical_harmonics.py
      - tests/test_independent_sh_validation.py
      - tests/test_sh_convention_lock.py
      - tests/test_sh_high_degree_stability.py
    see_also:
      - LUNARIS-ALG-SH-002
    notes: >-
      The absence of the Condon-Shortley phase is a convention, not a bug:
      applying (-1)^m would corrupt tesseral/sectoral terms while leaving zonal
      (J2) tests unaffected.

