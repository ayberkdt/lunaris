  - id: LUNARIS-ALG-INT-004
    slug: gragg_bulirsch_stoer_extrapolation
    canonical_name: >-
      Gragg-Bulirsch-Stoer extrapolation with the modified midpoint rule
      (exposed as the RK8 token)
    category: integrator
    domain: INT
    status: active
    added: "2026-07-14"
    implementation_class: exact
    verification_status: verified_primary_source
    scientific_status: implemented_and_tested
    citation_keys:
      - HairerNorsettWanner1993ODEsI
    primary_reference:
      type: book
      citation_key: HairerNorsettWanner1993ODEsI
      identifier_kind: isbn
      doi: null
      isbn: 978-3-540-56670-0
      report_number: null
      standard_number: null
      official_url: null
      edition: Second Revised
      chapter: "II (Runge-Kutta and Extrapolation Methods)"
      section: "II.9 (extrapolation methods; Gragg modified midpoint)"
      equations: []
      pages: null
      verification_notes: >-
        The code applies Gragg's symmetric modified-midpoint rule over the
        sub-step sequence (2,4,6,8) and combines the results with the polynomial
        (Bulirsch-Stoer / Deuflhard) extrapolation recurrence
        T[i] += (T[i]-T[i-1])/((n_i/n_{i-k})^2 - 1). This is the
        Gragg-Bulirsch-Stoer extrapolation method (Hairer, Norsett & Wanner 1993,
        Chapter II, extrapolation methods), NOT an 8th-order Runge-Kutta tableau.
        Book ISBN verified.
    symbols:
      - path: src/lunaris/core/propagation/integrators/rk.py
        symbol: _rk8_step_full
        role: cpu_implementation
      - path: src/lunaris/core/propagation/integrators/rk.py
        symbol: _modified_midpoint
        role: cpu_implementation
    mathematical_contract:
      inputs: RHS f(t, y), state y, macro-step h
      outputs: high-order extrapolated state after one macro-step
      exact_or_approximate: high_order_extrapolation
      preserved_properties:
        - even-order error expansion of the symmetric midpoint rule
        - high effective order via extrapolation to zero sub-step
    lunaris_modifications:
      - fixed (2,4,6,8) sub-step sequence rather than an adaptive tableau
    assumptions:
      - smooth RHS (extrapolation assumes an asymptotic error expansion)
    limitations:
      - >-
        NAMING: the accepted token is RK8, but this is a Gragg-Bulirsch-Stoer
        extrapolation method, not a Runge-Kutta order-8 formula. See the
        traceability findings note.
    validation:
      - tests/test_integrators.py
      - tests/test_batched_fixed_step.py
    see_also: []
    notes: >-
      Naming finding: the RK8 alias is misleading; the implemented algorithm is
      Gragg-Bulirsch-Stoer extrapolation. The behaviour is correct and this entry
      does not change it; only the documented identity is corrected.

  - id: LUNARIS-ALG-INT-005
    slug: velocity_verlet_stormer_verlet
