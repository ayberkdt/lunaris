  - id: LUNARIS-ALG-INT-003
    slug: classical_rkn4_fixed_step
    canonical_name: Classical fourth-order Runge-Kutta-Nystrom method (RKN4)
    category: integrator
    domain: INT
    status: active
    added: "2026-07-14"
    implementation_class: exact
    verification_status: identifier_verified_content_pending
    scientific_status: implemented_and_tested
    citation_keys:
      - HairerNorsettWanner1993ODEsI
    primary_reference:
      type: book
      citation_key: HairerNorsettWanner1993ODEsI
      identifier_kind: isbn
      doi: null
      isbn: 978-3-540-56670-0
      report_number: null
      standard_number: null
      official_url: null
      edition: Second Revised
      chapter: "II (Runge-Kutta and Extrapolation Methods)"
      section: Runge-Kutta-Nystrom methods for second-order ODEs
      equations: []
      pages: null
      verification_notes: >-
        Runge-Kutta-Nystrom methods for y'' = f(t, y) are treated in Hairer,
        Norsett & Wanner (1993), Chapter II. The implemented step uses r_mid with
        0.125 h^2 k1, r_end with 0.5 h^2 k2, position update r + h v +
        (h^2/6)(k1+2 k2) and velocity update v + (h/6)(k1+4 k2+k4), reusing k2=k3.
        Book ISBN verified; PENDING confirmation that these coefficients match
        the specific classical RKN4 tableau in the cited section (physical copy
        needed) rather than a different 4th-order RKN pair.
    symbols:
      - path: src/lunaris/core/propagation/integrators/rk.py
        symbol: _rkn4_step
        role: cpu_implementation
    mathematical_contract:
      inputs: acceleration a(t, y), packed position/velocity state, step h
      outputs: position/velocity advanced by one step
      exact_or_approximate: fourth_order_accurate
      preserved_properties:
        - direct second-order integration without reduction overhead
    lunaris_modifications:
      - single acceleration evaluation reused for k2 and k3
    assumptions:
      - dynamics expressible as y'' = a(t, y) (force independent of velocity)
    limitations:
      - inapplicable to velocity-dependent forces (e.g. relativistic drag terms)
    validation:
      - tests/test_integrators.py
      - tests/test_batched_fixed_step.py
    see_also: []
    notes: ""

  - id: LUNARIS-ALG-INT-004
    slug: gragg_bulirsch_stoer_extrapolation
    canonical_name: >-
      Gragg-Bulirsch-Stoer extrapolation with the modified midpoint rule
      (exposed as the RK8 token)
    category: integrator
    domain: INT
    status: active
    added: "2026-07-14"
    implementation_class: exact
    verification_status: verified_primary_source
    scientific_status: implemented_and_tested
    citation_keys:
      - HairerNorsettWanner1993ODEsI
    primary_reference:
      type: book
      citation_key: HairerNorsettWanner1993ODEsI
      identifier_kind: isbn
      doi: null
      isbn: 978-3-540-56670-0
      report_number: null
      standard_number: null
      official_url: null
      edition: Second Revised
      chapter: "II (Runge-Kutta and Extrapolation Methods)"
      section: "II.9 (extrapolation methods; Gragg modified midpoint)"
      equations: []
      pages: null
      verification_notes: >-
        The code applies Gragg's symmetric modified-midpoint rule over the
        sub-step sequence (2,4,6,8) and combines the results with the polynomial
        (Bulirsch-Stoer / Deuflhard) extrapolation recurrence
        T[i] += (T[i]-T[i-1])/((n_i/n_{i-k})^2 - 1). This is the
        Gragg-Bulirsch-Stoer extrapolation method (Hairer, Norsett & Wanner 1993,
        Chapter II, extrapolation methods), NOT an 8th-order Runge-Kutta tableau.
        Book ISBN verified.
    symbols:
      - path: src/lunaris/core/propagation/integrators/rk.py
        symbol: _rk8_step_full
        role: cpu_implementation
      - path: src/lunaris/core/propagation/integrators/rk.py
        symbol: _modified_midpoint
        role: cpu_implementation
    mathematical_contract:
      inputs: RHS f(t, y), state y, macro-step h
      outputs: high-order extrapolated state after one macro-step
      exact_or_approximate: high_order_extrapolation
      preserved_properties:
        - even-order error expansion of the symmetric midpoint rule
        - high effective order via extrapolation to zero sub-step
    lunaris_modifications:
      - fixed (2,4,6,8) sub-step sequence rather than an adaptive tableau
    assumptions:
      - smooth RHS (extrapolation assumes an asymptotic error expansion)
    limitations:
      - >-
        NAMING: the accepted token is RK8, but this is a Gragg-Bulirsch-Stoer
        extrapolation method, not a Runge-Kutta order-8 formula. See the
        traceability findings note.
    validation:
      - tests/test_integrators.py
      - tests/test_batched_fixed_step.py
    see_also: []
    notes: >-
      Naming finding: the RK8 alias is misleading; the implemented algorithm is
      Gragg-Bulirsch-Stoer extrapolation. The behaviour is correct and this entry
      does not change it; only the documented identity is corrected.

  - id: LUNARIS-ALG-INT-005
    slug: velocity_verlet_stormer_verlet
    canonical_name: Velocity Verlet (Stormer-Verlet) symplectic method
    category: integrator
    domain: INT
    status: active
    added: "2026-07-14"
    implementation_class: exact
    verification_status: verified_primary_source
    scientific_status: implemented_and_tested
    citation_keys:
      - HairerLubichWanner2006Geometric
    primary_reference:
      type: book
      citation_key: HairerLubichWanner2006Geometric
      identifier_kind: isbn
      doi: null
      isbn: 978-3-540-30663-4
      report_number: null
      standard_number: null
      official_url: null
      edition: Second
      chapter: "I (Examples and Numerical Experiments)"
      section: "The Stormer-Verlet method"
      equations: []
      pages: null
      verification_notes: >-
        The half-kick / drift / half-kick sequence (v_half = v + 0.5 h a0;
        r1 = r + h v_half; v1 = v_half + 0.5 h a1) is the velocity form of the
        Stormer-Verlet method treated in Hairer, Lubich & Wanner, "Geometric
        Numerical Integration", 2nd ed. ISBN 978-3-540-30663-4 verified via
        Springer/Amazon. Historical origins: Stormer, Verlet (1967, position
        form) and Swope et al. (1982, velocity form).
    symbols:
      - path: src/lunaris/core/propagation/integrators/symplectic.py
        symbol: _vv_step
        role: cpu_implementation
    mathematical_contract:
      inputs: acceleration a(t, y), packed state, step h
      outputs: symplectically advanced position/velocity
      exact_or_approximate: second_order_symplectic
      preserved_properties:
        - symplectic and time-reversible
        - bounded energy error for Hamiltonian systems
    lunaris_modifications: []
    assumptions:
      - separable Hamiltonian with velocity-independent force
    limitations:
      - only second order; use a composition method for higher order
    validation:
      - tests/test_integrators.py
      - tests/test_symplectic_strict_guard.py
    see_also:
      - LUNARIS-ALG-INT-006
      - LUNARIS-ALG-INT-007
    notes: >-
      Accepted aliases VV, VERLET, STORMER_VERLET and LEAPFROG all resolve to
      this method.

  - id: LUNARIS-ALG-INT-006
    slug: recursive_triple_jump_symplectic_composition
    canonical_name: >-
      Recursive triple-jump symmetric composition of velocity Verlet (Y4/Y6/Y8)
    category: integrator
    domain: INT
    status: active
    added: "2026-07-14"
    implementation_class: adaptation
    verification_status: verified_primary_source
    scientific_status: implemented_and_tested
    citation_keys:
      - Yoshida1990Symplectic
    primary_reference:
      type: article
      citation_key: Yoshida1990Symplectic
      identifier_kind: doi
      doi: 10.1016/0375-9601(90)90092-3
      isbn: null
      report_number: null
      standard_number: null
      official_url: null
      edition: null
      chapter: null
      section: Triple-jump composition construction
      equations: []
      pages: "262-268"
      verification_notes: >-
        H. Yoshida, "Construction of higher order symplectic integrators",
        Physics Letters A 150(5-7):262-268, 1990. DOI 10.1016/0375-9601(90)
        90092-3 verified via ScienceDirect/ADS. The code composes velocity-Verlet
        sub-steps with the triple-jump weights x1 = 1/(2 - 2^{1/(2k+1)}),
        x0 = -2^{1/(2k+1)}/(2 - 2^{1/(2k+1)}). Y4 (k=1) reproduces the
        Forest-Ruth / Yoshida 4th-order integrator. NAMING: Y6/Y8 use this
        recursive triple-jump construction, NOT Yoshida's optimized minimal-stage
        6th/8th-order coefficient sets (which the same paper obtains by solving
        the order conditions numerically).
    symbols:
      - path: src/lunaris/core/propagation/integrators/symplectic.py
        symbol: _composition_weights
        role: cpu_implementation
      - path: src/lunaris/core/propagation/integrators/symplectic.py
        symbol: _composed_step
        role: cpu_implementation
      - path: src/lunaris/core/propagation/integrators/symplectic.py
        symbol: _y6_step
        role: cpu_implementation
    mathematical_contract:
      inputs: acceleration a(t, y), packed state, step h, composition order
      outputs: symplectically advanced state of order 2k
      exact_or_approximate: order_2k_symplectic
      preserved_properties:
        - symplectic and time-reversible at every composition level
    lunaris_modifications:
      - recursive triple-jump rather than optimized minimal-stage coefficients
    assumptions:
      - separable Hamiltonian with velocity-independent force
    limitations:
      - >-
        Y6/Y8 have larger error constants than Yoshida's optimized solution sets
        because the recursive triple jump uses more sub-steps.
    validation:
      - tests/test_integrators.py
      - tests/test_symplectic_strict_guard.py
    see_also:
      - LUNARIS-ALG-INT-005
    notes: >-
      Naming clarification: only Y4 is literally Yoshida's coefficient set; Y6/Y8
      are the recursive triple-jump (Suzuki fractal) construction. The methods
      are valid symplectic integrators of the stated order.

