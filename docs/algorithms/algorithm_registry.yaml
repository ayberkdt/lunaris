      - tests/test_torch_third_body.py
    see_also:
      - LUNARIS-ALG-TB-002
    notes: >-
      This is a numerically stable reformulation of the SAME differential
      acceleration, not a different physical force model. Do not describe it as a
      distinct perturbation.

