# Lunaris algorithm registry
# ===========================
# Machine-readable source of truth for the algorithm-traceability system.
# Maps stable Lunaris algorithm identifiers (Layer 1) to verified bibliographic
# citation keys (Layer 2, defined in references/references.bib) and canonical
# method names (Layer 3), plus the implementing source symbols, validating
# tests, assumptions and limitations.
#
# WORKFLOW after every edit:
#   python tools/algorithm_registry.py validate
#   python tools/algorithm_registry.py generate
#   git add docs/algorithms/algorithm_registry.yaml references/references.bib \
#           docs/ALGORITHM_CATALOG.md
#
# HARD RULES (see docs/ALGORITHM_TRACEABILITY_POLICY.md):
#   * IDs are permanent. Never renumber, reuse, or delete an id; retire it with
#     status: retired instead.
#   * Never claim verification_status: verified_primary_source without having
#     confirmed the defining section/equation in the primary source.
#   * Non-HEUR entries require at least one citation key and a primary_reference.

registry_version: 1
generated_catalog: docs/ALGORITHM_CATALOG.md
