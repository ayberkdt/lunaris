  - id: LUNARIS-MODEL-TID-001
    slug: lunar_solid_tide_love_degree_2_3
    canonical_name: >-
      Elastic lunar solid-body tide (degree-2 and degree-3 Love-number disturbing
      potential)
    category: physical_model
    domain: TID
    status: active
    added: "2026-07-14"
    implementation_class: adaptation
    verification_status: verified_primary_source
    scientific_status: implemented_and_tested
    citation_keys:
      - PetitLuzum2010IERSConventions
    primary_reference:
      type: techreport
      citation_key: PetitLuzum2010IERSConventions
      identifier_kind: report_number
      doi: null
      isbn: 978-3-89888-989-6
      report_number: IERS Technical Note No. 36
      standard_number: null
      official_url: https://www.iers.org/IERS/EN/Publications/TechnicalNotes/tn36.html
      edition: null
      chapter: "6 (Effects of the solid Earth tides)"
      section: "6.1 (elastic solid Earth tides, Love-number formulation)"
      equations: []
      pages: null
      verification_notes: >-
        The Love-number disturbing potential dU_l = k_l mu_j/|R_j| (R/|r|)^(l+1)
        (R/|R_j|)^l P_l(c) and its gradient follow the elastic solid-tide
        formalism of IERS Conventions (2010), TN 36, Chapter 6. Lunaris applies
        this Earth-tide formalism to the MOON (lunar Love numbers k2/k3), an
        adaptation of the terrestrial convention; instantaneous elastic response
        only.
    symbols:
      - path: src/lunaris/physics/solid_tides.py
        symbol: solid_tide_potential_degree_numba
        role: numba_implementation
      - path: src/lunaris/physics/solid_tides.py
        symbol: accel_solid_tides_numba
        role: numba_implementation
      - path: src/lunaris/physics/solid_tides.py
        symbol: calc_solid_tide_accel
        role: api_entry_point
    mathematical_contract:
      inputs: >-
        Moon-fixed spacecraft and tide-raising-body vectors, body mu, lunar
        radius, Love number, and degree (2 or 3)
      outputs: solid-tide acceleration (m/s^2), gradient of the positive potential
      exact_or_approximate: exact_gradient_of_elastic_tide_potential
      preserved_properties:
        - degree-2 and degree-3 Love-number response
    lunaris_modifications:
      - terrestrial IERS Love-tide formalism applied to lunar parameters
      - dimensionless radius ratios to avoid large intermediate powers
    assumptions:
      - instantaneous elastic response (no lag, dissipation, ocean/thermal tides)
    limitations:
      - no anelastic/frequency-dependent Love numbers; degrees 2 and 3 only
    validation:
      - tests/test_solid_tides.py
    see_also:
      - LUNARIS-ALG-SH-002
    notes: >-
      Lunaris uses the Earth-tide convention with lunar Love numbers; this is an
      adaptation, not a lunar-specific published tide model.

  - id: LUNARIS-STD-FRM-001
    slug: lunar_principal_axis_body_frame
    canonical_name: Lunar principal-axis (PA) body-fixed frame realized by DE440
    category: frame_time_convention
    domain: FRM
    status: active
    added: "2026-07-14"
    implementation_class: standard_implementation
    verification_status: verified_primary_source
    scientific_status: implemented_and_tested
    citation_keys:
      - ParkFolkner2021DE440
    primary_reference:
      type: article
      citation_key: ParkFolkner2021DE440
      identifier_kind: doi
      doi: 10.3847/1538-3881/abd414
      isbn: null
      report_number: null
      standard_number: null
      official_url: https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/
      edition: null
      chapter: null
      section: Lunar orientation and principal-axis frame
      equations: []
      pages: "105"
      verification_notes: >-
        The lunar body-fixed frame used for spherical-harmonic gravity is the
        principal-axis (PA) frame defined by the DE440 lunar libration (Park et
        al. 2021, DOI 10.3847/1538-3881/abd414 verified), realized through SPICE
        PCK/BPC kernels. This is distinct from the mean-Earth/polar-axis (ME)
        frame; GRAIL SHADR coefficients are defined in the PA frame, which is why
        Lunaris evaluates the field there.
    symbols:
      - path: src/lunaris/common/frame_policy.py
        symbol: resolve_frame_policy
        role: config_surface
      - path: src/lunaris/core/torch_frame.py
        symbol: null
        role: config_surface
    mathematical_contract:
      inputs: inertial state and a lunar-orientation quaternion
      outputs: state expressed in the lunar principal-axis body frame
      exact_or_approximate: frame_convention
      preserved_properties:
        - consistency between the gravity-coefficient frame and the rotation applied
    lunaris_modifications:
      - rotation realized with the scalar-first Hamilton quaternion (LUNARIS-ALG-FRM-002)
    assumptions:
      - orientation quaternions are the DE440-consistent PA realization
    limitations:
      - does not implement the mean-Earth/polar-axis (ME) frame
    validation:
      - tests/test_frame_policy.py
      - tests/test_sh_convention_lock.py
    see_also:
      - LUNARIS-ALG-FRM-002
      - LUNARIS-DATA-EPH-001
      - LUNARIS-ALG-SH-002
    notes: >-
      PA vs ME is a common source of lunar-gravity frame errors; this entry
      records that Lunaris uses the PA frame consistent with the coefficient set.
