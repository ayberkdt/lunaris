      isbn: 978-3-540-67280-7
      report_number: null
      standard_number: null
      official_url: null
      edition: null
      chapter: "3 (Force Models)"
      section: "3.2 (gravitational field / spherical-harmonic expansion)"
      equations: []
      pages: null
      verification_notes: >-
        O. Montenbruck and E. Gill, "Satellite Orbits: Models, Methods and
        Applications", Springer, 2000. ISBN 978-3-540-67280-7 and DOI
        10.1007/978-3-642-58351-3 verified; Chapter 3 (Force Models) confirmed
