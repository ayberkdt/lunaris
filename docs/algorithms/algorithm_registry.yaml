        Mathematics and Methods of Astrodynamics", Revised Edition, AIAA
        Education Series, 1999, ISBN 978-1-56347-342-5. The implemented device
        rewrites F = (1+q)^{3/2} - 1 as q(3+3q+q^2)/(1+(1+q)^{3/2}) to avoid the
        subtractive cancellation of the direct differential form; this identity
        is elementary and was checked independently, and the F(q)/Encke device is
        attributed to Battin by GMAT's MathSpec and multiple modern propagators.
        PENDING: exact Battin chapter/section/equation number (physical copy
        needed) before this may be promoted to verified_primary_source.
    symbols:
