  - id: LUNARIS-HEUR-SH-001
    slug: pole_stable_order_truncation
    canonical_name: Pole-stable spherical-harmonic order truncation (stable-m limit)
    category: heuristic
    domain: SH
    status: active
    added: "2026-07-14"
    implementation_class: heuristic
    verification_status: unverifiable
    scientific_status: implemented_and_tested
    citation_keys: []
    primary_reference: null
    symbols:
      - path: src/lunaris/physics/spherical_harmonics.py
        symbol: _compute_stable_m_limit
        role: numba_implementation
    mathematical_contract:
      inputs: cos(geocentric latitude) and maximum degree
      outputs: highest order m for which cos(phi)^m stays above the float64 floor
      exact_or_approximate: conservative_truncation
      preserved_properties:
        - skips only orders whose sectoral terms have underflowed to zero
    lunaris_modifications:
      - >-
        Lunaris-specific policy m < LOG_UNDERFLOW_LIMIT / ln|cos phi|, clamped to
        [0, max_degree], with exact-pole and near-equator special cases.
    assumptions:
      - underflowed high-order sectoral terms contribute negligibly
    limitations:
      - performance/stability policy, not a change to the physical field
      - >-
        The negligibility assumption holds only while the underflow cut stays
        below the oscillatory-region boundary m ~ N cos(phi), i.e. for
        N <= ~1900 in float64. Measured at N=1800 (2026-07-14): full-m and
        stable-m kernels agree to 3.6e-14 worst-case across latitudes,
        pyshtools cross-check 1e-9 class. For N > ~1900 the cut would drop
        physically recovering columns and Holmes-Featherstone scaling is
        needed instead.
    validation:
      - tests/test_spherical_harmonics.py
      - tests/test_sh_frame_invariants.py
      - tests/test_sh_high_degree_stability.py
    see_also:
      - LUNARIS-ALG-SH-002
    notes: >-
      Project-specific heuristic; no external primary source. Justified by the
      float64 underflow floor rather than a published algorithm.

