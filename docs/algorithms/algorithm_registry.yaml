entries:
  - id: LUNARIS-ALG-INT-001
    slug: dop853_adaptive_runge_kutta_delegation
    canonical_name: >-
      Dormand-Prince 8(5,3) explicit Runge-Kutta method as delegated to SciPy DOP853
    category: integrator
    domain: INT
    status: active
    added: "2026-07-14"
    implementation_class: delegated_library
    verification_status: verified_primary_source
    scientific_status: implemented_and_tested
    citation_keys:
      - Virtanen2020SciPy
      - HairerNorsettWanner1993ODEsI
    primary_reference:
      type: article
      citation_key: Virtanen2020SciPy
      identifier_kind: doi
      doi: 10.1038/s41592-019-0686-2
      isbn: null
      report_number: null
      standard_number: null
      official_url: https://docs.scipy.org/doc/scipy/reference/generated/scipy.integrate.DOP853.html
      edition: null
      chapter: null
      section: "scipy.integrate.solve_ivp method='DOP853'"
      equations: []
      pages: "261-272"
      verification_notes: >-
        Lunaris delegates adaptive integration to scipy.integrate.solve_ivp; the
        DOP853 method is SciPy's Python port of Hairer's DOP853 (explicit
        Runge-Kutta of order 8(5,3) with a 5th/3rd-order error estimator and
        7th-order dense output). SciPy paper DOI 10.1038/s41592-019-0686-2
        verified (Nature Methods 17(3):261-272, 2020); the official SciPy DOP853
        page confirms the order-8(5,3) Dormand-Prince identity and cites Hairer,
        Norsett & Wanner (1993). Method-origin book ISBN 978-3-540-56670-0
        verified; exact Hairer section (II) pending physical-copy confirmation.
    symbols:
      - path: src/lunaris/core/propagation/integrators/scipy.py
        symbol: _resolve_scipy_method
        role: delegation_wrapper
      - path: src/lunaris/core/propagation/scipy_runner.py
        symbol: run_scipy_propagation
        role: cpu_implementation
      - path: src/lunaris/common/integrator_methods.py
        symbol: null
        role: config_surface
    mathematical_contract:
      inputs: >-
        Right-hand-side callable f(t, y), initial state, integration span and
        absolute/relative tolerances (SI units).
      outputs: State trajectory sampled on the requested output grid.
      exact_or_approximate: adaptive_error_controlled_approximation
      preserved_properties:
        - embedded 5(3) error estimate drives adaptive step control
        - 7th-order dense output for off-node sampling
    lunaris_modifications:
      - >-
        Lunaris only selects and configures the SciPy method (token resolution,
        tolerance policy, chunked output grid); the stepper itself is unmodified.
    assumptions:
      - non-stiff dynamics over each integration chunk
      - right-hand side is sufficiently smooth for high-order accuracy
    limitations:
      - not symplectic; long-horizon energy behaviour is not structurally bounded
      - stiff regimes should use an implicit method (Radau/BDF) instead
    validation:
      - tests/test_integrators.py
      - tests/test_solver_policy_and_telemetry.py
      - tests/test_solver_tolerance_defaults.py
    see_also: []
    notes: >-
      Additional SciPy methods (RK45, RK23, Radau, BDF, LSODA) share this
      delegation surface and will receive their own ids during Phase 2.

  - id: LUNARIS-ALG-SH-001
    slug: fully_normalized_alf_forward_column_recursion
    canonical_name: >-
      Standard forward-column recursion of fully-normalized associated Legendre
      functions
    category: numerical_algorithm
    domain: SH
    status: active
    added: "2026-07-14"
    implementation_class: exact
    verification_status: verified_primary_source
    scientific_status: implemented_and_tested
    citation_keys:
      - HolmesFeatherstone2002Legendre
    primary_reference:
      type: article
      citation_key: HolmesFeatherstone2002Legendre
      identifier_kind: doi
      doi: 10.1007/s00190-002-0216-2
      isbn: null
      report_number: null
      standard_number: null
      official_url: null
      edition: null
      chapter: null
      section: Standard forward-column recursion of normalised ALFs
      equations: []
      pages: "279-299"
      verification_notes: >-
        S. A. Holmes and W. E. Featherstone, "A unified approach to the Clenshaw
        summation and the recursive computation of very high degree and order
        normalised associated Legendre functions", Journal of Geodesy 76(5):
        279-299, 2002. DOI 10.1007/s00190-002-0216-2 verified via Springer. The
        implemented diagonal seed sqrt((2n+1)/2n), sub-diagonal sqrt(2n+1) and
        vertical coefficients A[n,m]=sqrt((2n-1)(2n+1)/((n-m)(n+m))),
        B[n,m]=sqrt((2n+1)(n-m-1)(n+m-1)/((2n-3)(n+m)(n-m))) are exactly the
        standard forward-column recursion presented in this paper (also Colombo
        1981).
    symbols:
      - path: src/lunaris/physics/spherical_harmonics.py
        symbol: build_legendre_coeffs
        role: reference_implementation
      - path: src/lunaris/physics/spherical_harmonics.py
        symbol: _compute_legendre_polynomials_inplace
        role: numba_implementation
      - path: src/lunaris/physics/spherical_harmonics.py
        symbol: _apply_legendre_normalization
        role: numba_implementation
    mathematical_contract:
      inputs: maximum degree, sin/cos of geocentric latitude
      outputs: >-
        fully-normalized associated Legendre functions P_nm and their latitude
        derivatives dP_nm/dphi
      exact_or_approximate: exact_recurrence
      preserved_properties:
        - 4-pi (geodesy) full normalization
        - numerical stability to very high degree/order
    lunaris_modifications:
      - >-
        Geodesy convention: no Condon-Shortley phase, real-harmonic sqrt(2)
        scaling for m>0 (matches GRAIL/EGM/GRACE/ICGEM coefficient definitions).
      - pole-safe per-order truncation via the stable-m limit (see LUNARIS-HEUR-SH-001)
    assumptions:
      - IEEE-754 float64 arithmetic
      - coefficients supplied in the same normalization convention
    limitations:
      - Condon-Shortley phase must be excluded by the coefficient provider
    validation:
      - tests/test_spherical_harmonics.py
      - tests/test_independent_sh_validation.py
      - tests/test_sh_convention_lock.py
    see_also:
      - LUNARIS-ALG-SH-002
    notes: >-
      The absence of the Condon-Shortley phase is a convention, not a bug:
      applying (-1)^m would corrupt tesseral/sectoral terms while leaving zonal
      (J2) tests unaffected.

  - id: LUNARIS-ALG-SH-002
