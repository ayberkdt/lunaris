# Lunaris algorithm registry
# ===========================
# Machine-readable source of truth for the algorithm-traceability system.
# Maps stable Lunaris algorithm identifiers (Layer 1) to verified bibliographic
# citation keys (Layer 2, defined in references/references.bib) and canonical
# method names (Layer 3), plus the implementing source symbols, validating
# tests, assumptions and limitations.
#
# WORKFLOW after every edit:
#   python tools/algorithm_registry.py validate
#   python tools/algorithm_registry.py generate
#   git add docs/algorithms/algorithm_registry.yaml references/references.bib \
#           docs/ALGORITHM_CATALOG.md
#
# HARD RULES (see docs/ALGORITHM_TRACEABILITY_POLICY.md):
#   * IDs are permanent. Never renumber, reuse, or delete an id; retire it with
#     status: retired instead.
#   * Never claim verification_status: verified_primary_source without having
#     confirmed the defining section/equation in the primary source.
#   * Non-HEUR entries require at least one citation key and a primary_reference.

registry_version: 1
generated_catalog: docs/ALGORITHM_CATALOG.md
unreferenced_bib_allowlist: []

entries:
  - id: LUNARIS-ALG-INT-001
    slug: dop853_adaptive_runge_kutta_delegation
    canonical_name: >-
      Dormand-Prince 8(5,3) explicit Runge-Kutta method as delegated to SciPy DOP853
    category: integrator
    domain: INT
    status: active
    added: "2026-07-14"
    implementation_class: delegated_library
    verification_status: verified_primary_source
    scientific_status: implemented_and_tested
    citation_keys:
      - Virtanen2020SciPy
      - HairerNorsettWanner1993ODEsI
    primary_reference:
      type: article
      citation_key: Virtanen2020SciPy
      identifier_kind: doi
      doi: 10.1038/s41592-019-0686-2
      isbn: null
      report_number: null
      standard_number: null
      official_url: https://docs.scipy.org/doc/scipy/reference/generated/scipy.integrate.DOP853.html
      edition: null
      chapter: null
      section: "scipy.integrate.solve_ivp method='DOP853'"
      equations: []
      pages: "261-272"
      verification_notes: >-
        Lunaris delegates adaptive integration to scipy.integrate.solve_ivp; the
        DOP853 method is SciPy's Python port of Hairer's DOP853 (explicit
        Runge-Kutta of order 8(5,3) with a 5th/3rd-order error estimator and
        7th-order dense output). SciPy paper DOI 10.1038/s41592-019-0686-2
        verified (Nature Methods 17(3):261-272, 2020); the official SciPy DOP853
        page confirms the order-8(5,3) Dormand-Prince identity and cites Hairer,
        Norsett & Wanner (1993). Method-origin book ISBN 978-3-540-56670-0
        verified; exact Hairer section (II) pending physical-copy confirmation.
    symbols:
      - path: src/lunaris/core/propagation/integrators/scipy.py
        symbol: _resolve_scipy_method
        role: delegation_wrapper
      - path: src/lunaris/core/propagation/scipy_runner.py
        symbol: run_scipy_propagation
        role: cpu_implementation
      - path: src/lunaris/common/integrator_methods.py
        symbol: null
        role: config_surface
    mathematical_contract:
      inputs: >-
        Right-hand-side callable f(t, y), initial state, integration span and
        absolute/relative tolerances (SI units).
      outputs: State trajectory sampled on the requested output grid.
      exact_or_approximate: adaptive_error_controlled_approximation
      preserved_properties:
        - embedded 5(3) error estimate drives adaptive step control
        - 7th-order dense output for off-node sampling
    lunaris_modifications:
      - >-
        Lunaris only selects and configures the SciPy method (token resolution,
        tolerance policy, chunked output grid); the stepper itself is unmodified.
    assumptions:
      - non-stiff dynamics over each integration chunk
      - right-hand side is sufficiently smooth for high-order accuracy
    limitations:
      - not symplectic; long-horizon energy behaviour is not structurally bounded
      - stiff regimes should use an implicit method (Radau/BDF) instead
    validation:
      - tests/test_integrators.py
      - tests/test_solver_policy_and_telemetry.py
      - tests/test_solver_tolerance_defaults.py
    see_also: []
    notes: >-
      Additional SciPy methods (RK45, RK23, Radau, BDF, LSODA) share this
      delegation surface and will receive their own ids during Phase 2.

